# Try statusrelay end to end: the daemon, Prometheus, and Grafana with the
# dashboard provisioned. Nobody is paged (notify.log_only).
#
#   docker compose -f examples/docker-compose/compose.yaml up -d
#   open http://localhost:3000/d/statusrelay
#
# Ports bind to loopback: /metrics has no auth and Grafana's anonymous
# viewer is on. Sign in as admin/admin to edit.
name: statusrelay-example

services:
  statusrelay:
    # v0.x minor bumps may change config keys; the patch tag floats safely.
    image: ghcr.io/rahadiangg/statusrelay:v0.2
    volumes:
      - ./statusrelay.compose.yaml:/etc/statusrelay/statusrelay.yaml:ro
      # Without a volume every restart is a cold start and re-reads history.
      - statusrelay-data:/data
    ports: ["127.0.0.1:9101:9101"]
    restart: unless-stopped

  prometheus:
    image: prom/prometheus:v3.5.0
    volumes:
      - ./prometheus.yml:/etc/prometheus/prometheus.yml:ro
    ports: ["127.0.0.1:9090:9090"]
    depends_on: [statusrelay]
    restart: unless-stopped

  grafana:
    image: grafana/grafana:12.1.0
    environment:
      GF_AUTH_ANONYMOUS_ENABLED: "true"
      GF_AUTH_ANONYMOUS_ORG_ROLE: Viewer
      GF_DASHBOARDS_DEFAULT_HOME_DASHBOARD_PATH: /var/lib/grafana/dashboards/statusrelay.json
    volumes:
      - ./grafana/provisioning:/etc/grafana/provisioning:ro
      - ./grafana/dashboards:/var/lib/grafana/dashboards:ro
    ports: ["127.0.0.1:3000:3000"]
    depends_on: [prometheus]
    restart: unless-stopped

volumes:
  statusrelay-data:
