name: ci

on:
  push:
    branches: [main]
  pull_request:
  # release.yml calls this so a tag can only be released after the same gates
  # a PR passes. Keep the jobs self-contained: a caller inherits nothing else.
  workflow_call:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - name: gofmt
        run: |
          unformatted=$(gofmt -l cmd internal)
          if [ -n "$unformatted" ]; then
            echo "not gofmt'd:"; echo "$unformatted"; exit 1
          fi
      # The action lags the v2 release line, so install the pinned binary.
      - name: install golangci-lint
        run: go install github.com/golangci/golangci-lint/v2/cmd/golangci-lint@v2.12.1
      - run: golangci-lint run

  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - run: go vet ./...
      - name: test
        run: go test ./... -race -count=1 -covermode=atomic -coverprofile=coverage.out
      - name: coverage floor
        run: |
          total=$(go tool cover -func=coverage.out | tail -1 | awk '{print $3}' | tr -d '%')
          echo "total coverage: $total%"
          awk -v t="$total" 'BEGIN { if (t+0 < 85.0) { print "FAIL: coverage below 85%"; exit 1 } }'

      # A suite that runs zero tests reports success. For a service whose entire
      # job is noticing silence, a vacuously-green suite is exactly the wrong
      # failure mode, so refuse it explicitly.
      - name: refuse a vacuous suite
        run: |
          count=$(go test ./... -count=1 -run . -v 2>/dev/null | grep -c '^=== RUN' || true)
          echo "ran $count tests"
          if [ "$count" -lt 30 ]; then
            echo "FAIL: only $count tests ran; the suite is not exercising the code"
            exit 1
          fi

  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - run: CGO_ENABLED=0 go build -trimpath ./...
      # The release pipeline's own config and every OS/arch it targets are
      # exercised here, so a broken .goreleaser.yaml or a Windows-only compile
      # error fails the PR rather than the tag. Docker is skipped: the image
      # is verified by the release job, and buildx on a PR is slow for nothing.
      - name: goreleaser snapshot build
        uses: goreleaser/goreleaser-action@v6
        with:
          distribution: goreleaser
          version: "~> v2"
          args: build --snapshot --clean
