# Nightly schema-drift alarm against the real upstream.
#
# The upstream is undocumented and unversioned. Unit tests run against frozen
# fixtures and stay green when it changes shape, so this is the only thing that
# notices. A failure here is a signal, not a flake.
name: livecheck

on:
  schedule:
    - cron: "17 3 * * *"
  workflow_dispatch:

permissions:
  contents: read
  issues: write

jobs:
  canary:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - id: canary
        run: go test -tags live -count=1 -v ./internal/incident/canary/
      - if: failure()
        uses: actions/github-script@v7
        with:
          script: |
            await github.rest.issues.create({
              owner: context.repo.owner,
              repo: context.repo.repo,
              title: `upstream schema drift detected (${new Date().toISOString().slice(0,10)})`,
              body: `The nightly live canary failed. The upstream status API has likely changed shape.\n\nRun: ${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`,
              labels: ['upstream-drift'],
            })
